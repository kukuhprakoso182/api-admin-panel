services:
  app:
    build: .
    container_name: api-admin-panel
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Di dalam container, MySQL adalah service "mysql", bukan 127.0.0.1
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Named volume (bukan bind mount) agar bisa ditulis user non-root di container
      - app_logs:/logs
    networks:
      - api-admin-panel-network

  mysql:
    image: mysql:8.0
    container_name: api-admin-panel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      # Hanya bisa diakses dari mesin host; jangan expose ke jaringan publik
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-admin-panel-network

volumes:
  mysql_data:
  app_logs:

networks:
  api-admin-panel-network:
    driver: bridge
